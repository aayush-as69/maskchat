# Phase 22: production-ish HA topology for a controlled deployment.
# Put a real TLS load balancer/CDN in front of nginx, or mount certificates
# into nginx and terminate TLS there. Do not expose the app containers directly.
services:
  maskchat-1:
    build:
      context: .
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    environment: &maskchat-env
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://maskchat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/maskchat
      POSTGRES_SSL: 0
      REQUIRE_POSTGRES: 1
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      ALIAS_SECRET: ${ALIAS_SECRET:?set ALIAS_SECRET}
      AUTH_MODE: trusted-token
      IDENTITY_VERIFICATION_SECRET: ${IDENTITY_VERIFICATION_SECRET:?set IDENTITY_VERIFICATION_SECRET}
      OFFENDER_REF_SECRET: ${OFFENDER_REF_SECRET:?set OFFENDER_REF_SECRET}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-1}
      TRUST_PROXY: 1
      INSTANCE_ID: maskchat-1
      INSTITUTIONS: ${INSTITUTIONS:?set INSTITUTIONS}
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGIN_REDIRECT: ${OIDC_POST_LOGIN_REDIRECT:-}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid email profile}
      OIDC_MAX_AGE_SECONDS: ${OIDC_MAX_AGE_SECONDS:-600}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  maskchat-2:
    build:
      context: .
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    environment:
      <<: *maskchat-env
      INSTANCE_ID: maskchat-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      maskchat-1: { condition: service_healthy }
      maskchat-2: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maskchat
      POSTGRES_USER: maskchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maskchat -d maskchat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
