<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MaskChat · Admin Dashboard</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b0d;color:#edf5f7}header{padding:20px 28px;border-bottom:1px solid #1d2a2f;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{margin:0;font-size:20px}nav a{color:#83d4e8;text-decoration:none;font-size:13px;margin-left:16px}main{max-width:1180px;margin:auto;padding:24px 28px 80px}.toolbar{display:flex;gap:8px;margin-bottom:22px}.toolbar input{flex:1;padding:11px 12px;background:#10171a;border:1px solid #27383e;color:#fff;border-radius:8px}.toolbar button{padding:10px 16px;border:0;border-radius:8px;background:#0b7b9e;color:#fff;font-weight:700}.toolbar .ghost{background:transparent;border:1px solid #33464d}.status{color:#91a5aa;font-size:13px;min-height:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:#0e1518;border:1px solid #1d2b30;border-radius:12px;padding:16px}.label{color:#81979d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:30px;font-weight:800;margin-top:7px}.sub{color:#81979d;font-size:12px;margin-top:5px}.section{margin-top:28px;margin-bottom:10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#81979d}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1b282d}.row:last-child{border-bottom:0}.bar{height:8px;background:#1a272b;border-radius:8px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#0b7b9e}.pill{font-size:11px;padding:4px 8px;border:1px solid #2b4148;border-radius:999px;color:#a9dce8}.empty{color:#81979d;padding:24px 0;text-align:center}@media(max-width:760px){.two{grid-template-columns:1fr}main{padding:18px}}
</style>
</head>
<body>
<header><h1>MaskChat — Admin Dashboard</h1><nav><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/">Reports</a><a href="/admin/metrics.html">Metrics</a></nav></header>
<main><div class="toolbar"><input id="token" type="password" placeholder="Admin token" autocomplete="off"><button id="connect">Connect</button><button id="refresh" class="ghost">Refresh</button></div><div id="status" class="status">Enter ADMIN_TOKEN to load the dashboard.</div><div id="app"></div></main>
<script>
const token=document.getElementById('token'),status=document.getElementById('status'),app=document.getElementById('app');const saved=sessionStorage.getItem('maskchat-admin-token');if(saved)token.value=saved;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/admin/dashboard',{headers:{'x-admin-token':token.value.trim()}});const d=await r.json();if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);sessionStorage.setItem('maskchat-admin-token',token.value.trim());render(d);status.textContent=`Live dashboard · ${new Date(d.generatedAt).toLocaleTimeString()}`;}catch(e){status.textContent=e.message;app.innerHTML='<div class="empty">Dashboard unavailable.</div>'}}
function card(l,v,s=''){return `<div class="card"><div class="label">${l}</div><div class="value">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`}
function render(d){const top=Math.max(...d.popularTopics.map(x=>x.count),1);const maxQ=Math.max(...d.queue.byInstitution.map(x=>x.length),1);app.innerHTML=`
<div class="grid">${card('Live sessions',d.liveSessions.count,`${d.liveSessions.participants} participants · ${d.liveSessions.groups} groups`)}${card('Mentors available',d.mentorActivity.filter(x=>!x.active).length,`${d.mentorActivity.filter(x=>x.active).length} currently in sessions`)}${card('Queue length',d.queue.total,'students waiting now')}${card('Open reports',d.safety.statuses.open,`${d.safety.reports} total reports`)}${card('Repeat offenders',d.safety.repeatOffenders)}${card('Active bans',d.safety.activeBans)}</div>
<div class="section">Live sessions & mentor activity</div><div class="two"><div class="panel">${d.mentorActivity.length?d.mentorActivity.slice(0,10).map(m=>`<div class="row"><span>${esc(m.institutionId)} · ${esc(m.expertise)} · ${esc(m.language)}</span><span class="pill">${m.active?'In session':'Available'} · ${m.sessionsHosted} hosted · 👍 ${m.helpful}</span></div>`).join(''):'<div class="empty">No mentors currently visible.</div>'}</div><div class="panel">${d.liveSessions.count?`<div class="row"><b>Active sessions</b><span>${d.liveSessions.count}</span></div><div class="row"><b>Participants</b><span>${d.liveSessions.participants}</span></div><div class="row"><b>Group sessions</b><span>${d.liveSessions.groups}</span></div>`:'<div class="empty">No live sessions right now.</div>'}</div></div>
<div class="section">Popular topics</div><div class="panel">${d.popularTopics.length?d.popularTopics.map(x=>`<div class="row"><span>${esc(x.topic)}</span><div class="bar"><i style="width:${Math.round(x.count/top*100)}%"></i></div><span>${x.count}</span></div>`).join(''):'<div class="empty">No topic activity yet.</div>'}</div>
<div class="section">Queue by institution</div><div class="panel">${d.queue.byInstitution.length?d.queue.byInstitution.map(x=>`<div class="row"><span>${esc(x.name)}</span><div class="bar"><i style="width:${Math.round(x.length/maxQ*100)}%"></i></div><span>${x.length}</span></div>`).join(''):'<div class="empty">Queue is empty.</div>'}</div>
<div class="section">Safety events</div><div class="grid">${card('Open',d.safety.statuses.open)}${card('In review',d.safety.statuses.in_review)}${card('Resolved',d.safety.statuses.resolved)}${card('Violations',d.safety.violations)}${card('Cooldowns',d.safety.cooldowns)}${card('Blocked messages',d.safety.blockedMessages)}</div>
<div class="section">Institution overview</div><div class="panel">${d.institutions.length?d.institutions.map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><small>${esc(x.institutionId)}</small></span><span>Sessions ${x.activeSessions} · Mentors ${x.mentorsAvailable} · Queue ${x.queueLength} · Reports ${x.reports}</span></div>`).join(''):'<div class="empty">No institution activity yet.</div>'}</div>`}
document.getElementById('connect').onclick=load;document.getElementById('refresh').onclick=load;token.onkeydown=e=>{if(e.key==='Enter')load()};if(saved)load();
</script></body></html>
