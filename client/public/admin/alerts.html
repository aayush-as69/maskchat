<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaskChat · Moderator Alerts</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b0d;color:#edf5f7}header{padding:20px 28px;border-bottom:1px solid #1d2a2f;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}nav a{color:#83d4e8;text-decoration:none;margin-left:15px;font-size:13px}main{max-width:900px;margin:auto;padding:24px}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;padding:11px;background:#10171a;border:1px solid #27383e;color:#fff;border-radius:8px}.toolbar button{padding:10px 16px;border:0;border-radius:8px;background:#0b7b9e;color:#fff}.alert{margin-top:12px;padding:16px;border:1px solid #29383d;border-radius:12px;background:#0e1518}.alert.unread{border-color:#b45b4d}.meta{font-size:12px;color:#8da0a5}.empty{color:#81979d;text-align:center;padding:50px}</style></head><body><header><h1>MaskChat — Moderator Alerts</h1><nav><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/alerts.html">Alerts</a><a href="/admin/">Reports</a><a href="/admin/metrics.html">Metrics</a></nav></header><main><div class="toolbar"><input id="token" type="password" placeholder="Admin token"><button id="connect">Connect</button></div><p id="status" class="meta">Enter ADMIN_TOKEN.</p><div id="list"></div></main><script>const t=document.getElementById('token'),l=document.getElementById('list'),s=document.getElementById('status');const saved=sessionStorage.getItem('maskchat-admin-token');if(saved)t.value=saved;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/admin/alerts',{headers:{'x-admin-token':t.value.trim()}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');sessionStorage.setItem('maskchat-admin-token',t.value.trim());l.innerHTML=d.alerts.length?d.alerts.map(a=>`<article class="alert ${a.read?'':'unread'}"><b>${esc(a.type.replaceAll('_',' ').toUpperCase())}</b><p>${esc(a.message||'Moderator event')}</p><div class="meta">${new Date(a.createdAt).toLocaleString()} · ${esc(a.institutionId||'All institutions')}</div>${a.read?'':'<button onclick="mark(\''+a.id+'\')">Mark read</button>'}</article>`).join(''):'<div class="empty">No moderator alerts.</div>';s.textContent='Live · '+new Date().toLocaleTimeString()}async function mark(id){await fetch('/api/admin/alerts/'+id+'/read',{method:'POST',headers:{'x-admin-token':t.value.trim(),'content-type':'application/json'}});load()}document.getElementById('connect').onclick=()=>load().catch(e=>s.textContent=e.message);if(saved)load().catch(e=>s.textContent=e.message);setInterval(()=>{if(t.value.trim())load().catch(()=>{})},10000)</script></body></html>
