<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaskChat · Institutions</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b0d;color:#edf5f7}header{padding:20px 28px;border-bottom:1px solid #1d2a2f;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}nav a{color:#83d4e8;text-decoration:none;margin-left:15px;font-size:13px}main{max-width:1100px;margin:auto;padding:24px}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;padding:11px;background:#10171a;border:1px solid #27383e;color:#fff;border-radius:8px}.toolbar button{padding:10px 16px;border:0;border-radius:8px;background:#0b7b9e;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:22px}.card{border:1px solid #29383d;border-radius:12px;padding:18px;background:#0e1518}.brand{height:38px;width:38px;object-fit:contain;vertical-align:middle;margin-right:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}.stat{padding:12px;background:#111b1f;border-radius:8px}.stat span{display:block;color:#81979d;font-size:11px;text-transform:uppercase}.stat b{font-size:22px}.meta{color:#8da0a5;font-size:12px}.empty{padding:50px;text-align:center;color:#81979d}</style></head><body><header><h1>MaskChat — Institution Overview</h1><nav><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/institutions.html">Institutions</a><a href="/admin/alerts.html">Alerts</a><a href="/admin/">Reports</a></nav></header><main><div class="toolbar"><input id="token" type="password" placeholder="Admin token"><button id="connect">Connect</button></div><p id="status" class="meta">Enter ADMIN_TOKEN.</p><div id="grid" class="grid"></div></main><script>const t=document.getElementById('token'),g=document.getElementById('grid'),s=document.getElementById('status');const saved=sessionStorage.getItem('maskchat-admin-token');if(saved)t.value=saved;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/admin/dashboard',{headers:{'x-admin-token':t.value.trim()}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');sessionStorage.setItem('maskchat-admin-token',t.value.trim());const publicInfo=await fetch('/api/institutions').then(x=>x.json()).catch(()=>({institutions:[]}));const by=new Map(d.institutions.map(x=>[x.institutionId,x]));g.innerHTML=(publicInfo.institutions||[]).map(i=>{const x=by.get(i.id)||{activeSessions:0,mentorsAvailable:0,queueLength:0,reports:0};return `<article class="card">${i.branding?.logoUrl?`<img class="brand" src="${esc(i.branding.logoUrl)}" alt="">`:''}<b>${esc(i.name)}</b><p class="meta">${esc(i.domain)} · Moderation: ${esc(i.moderationContact||'Not configured')}</p><div class="stats"><div class="stat"><span>Active sessions</span><b>${x.activeSessions}</b></div><div class="stat"><span>Mentors</span><b>${x.mentorsAvailable}</b></div><div class="stat"><span>Queue</span><b>${x.queueLength}</b></div><div class="stat"><span>Reports</span><b>${x.reports}</b></div></div></article>`}).join('')||'<div class="empty">No institutions configured.</div>';s.textContent='Live · '+new Date().toLocaleTimeString()}document.getElementById('connect').onclick=()=>load().catch(e=>s.textContent=e.message);if(saved)load().catch(e=>s.textContent=e.message);setInterval(()=>{if(t.value.trim())load().catch(()=>{})},10000)</script></body></html>
