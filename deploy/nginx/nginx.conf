events {}

http {
  upstream maskchat_app {
    least_conn;
    server maskchat-1:3001 max_fails=3 fail_timeout=10s;
    server maskchat-2:3001 max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Preserve the scheme from a trusted TLS load balancer. When nginx is
  # reached directly, fall back to the local connection scheme.
  map $http_x_forwarded_proto $original_proto {
    default $scheme;
    https https;
    http http;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 32k;

    location / {
      proxy_pass http://maskchat_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $original_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /api/health { proxy_pass http://maskchat_app; }
    location = /api/ready { proxy_pass http://maskchat_app; }
  }
}
